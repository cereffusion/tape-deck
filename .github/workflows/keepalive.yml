name: Supabase keep-alive

# The Coeus apps share one free-tier Supabase project, which auto-pauses after
# 7 days with no activity (taking down reveal pages + admin for both products).
# This pings each app's /api/health daily — those endpoints run a trivial DB
# query, which counts as activity and keeps the project from pausing.

on:
  schedule:
    - cron: "17 9 * * *"   # daily at 09:17 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoints (touches shared Supabase DB)
        run: |
          set -e
          fail=0
          for url in \
            "https://www.futurephoto.app/api/health" \
            "https://www.mailamix.com/api/health"; do
            code=$(curl -s -m 30 -o /tmp/body -w "%{http_code}" "$url" || echo 000)
            echo "$url -> HTTP $code : $(cat /tmp/body 2>/dev/null)"
            if [ "$code" != "200" ]; then
              echo "::error::$url returned $code"
              fail=1
            fi
          done
          exit $fail
