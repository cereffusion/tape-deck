# Keeps the free-tier Supabase project from auto-pausing. Independent of the
# daily Vercel cron (vercel.json): if either one stops, the other still runs.
# Note: GitHub suspends scheduled workflows after 60 days with no repo commits.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping each app's /api/health (each runs a real DB query)
        run: |
          fail=0
          for url in https://www.mailamix.com/api/health https://www.futurephoto.app/api/health; do
            ok=0
            for i in 1 2 3; do
              body=$(curl -s -m 30 "$url") && echo "$url -> $body"
              if echo "$body" | grep -q '"db":"up"'; then ok=1; break; fi
              sleep 20
            done
            [ $ok = 1 ] || { echo "$url did not report db up" >&2; fail=1; }
          done
          exit $fail
